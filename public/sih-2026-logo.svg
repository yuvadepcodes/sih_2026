<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" fill="none">
  <!-- SIH 2026 Logo: Lightbulb with Brain Hemispheres (Orange & Green) + Base + SIH + Text -->
  <g transform="translate(15, 10)">
    <!-- Radiating Ray lines -->
    <!-- Top -->
    <line x1="85" y1="8" x2="85" y2="24" stroke="#0B3B60" stroke-width="5" stroke-linecap="round" />
    <!-- Top-Left 45 deg -->
    <line x1="32" y1="30" x2="44" y2="42" stroke="#0B3B60" stroke-width="5" stroke-linecap="round" />
    <!-- Left -->
    <line x1="10" y1="85" x2="26" y2="85" stroke="#0B3B60" stroke-width="5" stroke-linecap="round" />
    <!-- Bottom-Left -->
    <line x1="28" y1="136" x2="40" y2="124" stroke="#0B3B60" stroke-width="5" stroke-linecap="round" />
    <!-- Top-Right 45 deg -->
    <line x1="138" y1="30" x2="126" y2="42" stroke="#0B3B60" stroke-width="5" stroke-linecap="round" />
    <!-- Right -->
    <line x1="160" y1="85" x2="144" y2="85" stroke="#0B3B60" stroke-width="5" stroke-linecap="round" />
    <!-- Bottom-Right -->
    <line x1="142" y1="136" x2="130" y2="124" stroke="#0B3B60" stroke-width="5" stroke-linecap="round" />

    <!-- Brain Left Hemisphere (Orange / Saffron) -->
    <g fill="#F37023">
      <!-- Main outer lobe shapes -->
      <path d="M 81 32 C 70 30 52 38 48 52 C 44 64 45 74 48 82 C 45 88 44 98 48 106 C 52 115 62 124 74 125 C 79 125 81 123 81 123 L 81 32 Z" />
      <!-- Lobe convolutions & texture -->
      <circle cx="58" cy="50" r="10" />
      <circle cx="50" cy="72" r="10" />
      <circle cx="52" cy="95" r="10" />
      <circle cx="68" cy="118" r="9" />
      <circle cx="73" cy="40" r="9" />
    </g>
    <!-- Internal folds pattern on orange hemisphere -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 64 45 Q 74 48 70 60 Q 64 68 76 72 Q 62 82 72 90 Q 60 102 74 108" />
      <path d="M 54 62 Q 62 65 60 78" />
      <path d="M 56 88 Q 66 90 62 102" />
    </g>

    <!-- Brain Right Hemisphere (Green) -->
    <g fill="#00A651">
      <!-- Main outer lobe shapes -->
      <path d="M 89 32 C 100 30 118 38 122 52 C 126 64 125 74 122 82 C 125 88 126 98 122 106 C 118 115 108 124 96 125 C 91 125 89 123 89 123 L 89 32 Z" />
      <!-- Lobe convolutions & texture -->
      <circle cx="112" cy="50" r="10" />
      <circle cx="120" cy="72" r="10" />
      <circle cx="118" cy="95" r="10" />
      <circle cx="102" cy="118" r="9" />
      <circle cx="97" cy="40" r="9" />
    </g>
    <!-- Digital / circuit pattern on green hemisphere -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 106 45 Q 96 48 100 60 Q 106 68 94 72 Q 108 82 98 90 Q 110 102 96 108" />
      <path d="M 116 62 Q 108 65 110 78" />
      <path d="M 114 88 Q 104 90 108 102" />
      <!-- Digital dots -->
      <circle cx="106" cy="56" r="1.5" fill="#ffffff" stroke="none" />
      <circle cx="112" cy="76" r="1.5" fill="#ffffff" stroke="none" />
      <circle cx="104" cy="96" r="1.5" fill="#ffffff" stroke="none" />
    </g>

    <!-- Vertical Separation between hemispheres -->
    <line x1="85" y1="32" x2="85" y2="124" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Bulb Base (Navy Blue) -->
    <path d="M 68 132 L 102 132 L 96 166 L 74 166 Z" fill="#0B3B60" />

    <!-- "SIH" Text inside bulb base -->
    <text x="85" y="154" fill="#ffffff" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="1">SIH</text>

    <!-- Bulb bottom contact thread / orange tip -->
    <path d="M 77 169 Q 85 174 93 169" stroke="#F37023" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 80 173 Q 85 177 90 173" stroke="#0B3B60" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Typography Right Side: SMART INDIA HACKATHON 2026 -->
  <g fill="#0B3B60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="200" y="66" font-weight="900" font-size="34" letter-spacing="0.5">SMART INDIA</text>
    <text x="200" y="108" font-weight="900" font-size="34" letter-spacing="0.5">HACKATHON</text>
    <text x="200" y="156" font-weight="900" font-size="42" letter-spacing="1.5">2026</text>
  </g>
</svg>
